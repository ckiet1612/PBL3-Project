server.port=${PROVISIONING_PORT:8088}

spring.datasource.url=${TENANT_REGISTRY_JDBC_URL:${TIDB_JDBC_URL}}
spring.datasource.username=${TENANT_REGISTRY_USERNAME:${TIDB_USERNAME}}
spring.datasource.password=${TENANT_REGISTRY_PASSWORD:${TIDB_PASSWORD}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.enabled=false

app.seed.enabled=false
app.demo.seed=false
app.version-gate.enabled=false

provisioning.admin-jdbc-url=${TIDB_ADMIN_JDBC_URL:${TIDB_JDBC_URL}}
provisioning.admin-username=${TIDB_ADMIN_USERNAME:${TIDB_USERNAME}}
provisioning.admin-password=${TIDB_ADMIN_PASSWORD:${TIDB_PASSWORD}}
provisioning.tenant-jdbc-url-template=${TENANT_JDBC_URL_TEMPLATE:}
provisioning.api-key=${PROVISIONING_API_KEY:}
