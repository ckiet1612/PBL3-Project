app.tenant.bootstrap.enabled=true
# Release desktop clients must point to the remote HTTPS provisioning API.
# Local HTTP is available only for development with PROVISIONING_API_ALLOW_LOCAL=true.
provisioning.api.base-url=${PROVISIONING_API_BASE_URL:}
provisioning.api-key=${PROVISIONING_API_KEY:}
spring.main.web-application-type=none
app.api.session.secret=${APP_API_SESSION_SECRET:}
app.api.session.ttl-minutes=${APP_API_SESSION_TTL_MINUTES:720}

spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
spring.flyway.enabled=false

spring.datasource.hikari.minimum-idle=${TENANT_HIKARI_MIN_IDLE:${TIDB_HIKARI_MIN_IDLE:2}}
spring.datasource.hikari.maximum-pool-size=${TENANT_HIKARI_MAX_POOL_SIZE:${TIDB_HIKARI_MAX_POOL_SIZE:6}}
spring.datasource.hikari.connection-timeout=${TENANT_HIKARI_CONNECTION_TIMEOUT_MS:${TIDB_HIKARI_CONNECTION_TIMEOUT_MS:30000}}
spring.datasource.hikari.idle-timeout=${TENANT_HIKARI_IDLE_TIMEOUT_MS:${TIDB_HIKARI_IDLE_TIMEOUT_MS:600000}}
spring.datasource.hikari.max-lifetime=${TENANT_HIKARI_MAX_LIFETIME_MS:${TIDB_HIKARI_MAX_LIFETIME_MS:1800000}}
spring.datasource.hikari.keepalive-time=${TENANT_HIKARI_KEEPALIVE_TIME_MS:${TIDB_HIKARI_KEEPALIVE_TIME_MS:300000}}
