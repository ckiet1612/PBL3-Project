spring.application.name=pbl3-project
app.client.version=0.0.1-SNAPSHOT
app.version-gate.enabled=true
app.seed.enabled=true

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/pbl3_project?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway
# Regular desktop clients do not migrate the database automatically.
spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# SePay / VietQR
sepay.base-url=${SEPAY_BASE_URL:https://userapi.sepay.vn/v2}
sepay.qr-base-url=${SEPAY_QR_BASE_URL:https://qr.sepay.vn}
sepay.api-token=${SEPAY_API_TOKEN:}
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
sepay.bank=${SEPAY_BANK:}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.qr.expire-seconds=${SEPAY_QR_EXPIRE_SECONDS:300}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}

# REST API authentication. Configure APP_API_SESSION_SECRET in production so tokens
# remain valid across restarts and cannot be forged by another deployment.
app.api.session.secret=${APP_API_SESSION_SECRET:}
app.api.session.ttl-minutes=${APP_API_SESSION_TTL_MINUTES:720}
app.api.public-registration.enabled=false
