# TiDB uses the MySQL protocol, so the existing MySQL JDBC driver can be reused.
# Keep credentials outside source code and pass them through environment variables.
spring.datasource.url=${TIDB_JDBC_URL}
spring.datasource.username=${TIDB_USERNAME}
spring.datasource.password=${TIDB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

spring.datasource.hikari.minimum-idle=${TIDB_HIKARI_MIN_IDLE:2}
spring.datasource.hikari.maximum-pool-size=${TIDB_HIKARI_MAX_POOL_SIZE:6}
spring.datasource.hikari.connection-timeout=${TIDB_HIKARI_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${TIDB_HIKARI_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${TIDB_HIKARI_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${TIDB_HIKARI_KEEPALIVE_TIME_MS:300000}

# TiDB schema changes should be handled by the dedicated migration profile/tool.
spring.flyway.enabled=false

sepay.base-url=${SEPAY_BASE_URL:https://userapi.sepay.vn/v2}
sepay.qr-base-url=${SEPAY_QR_BASE_URL:https://qr.sepay.vn}
sepay.api-token=${SEPAY_API_TOKEN:}
sepay.webhook-api-key=${SEPAY_WEBHOOK_API_KEY:}
sepay.bank=${SEPAY_BANK:}
sepay.account-number=${SEPAY_ACCOUNT_NUMBER:}
sepay.qr.expire-seconds=${SEPAY_QR_EXPIRE_SECONDS:300}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
app.api.session.secret=${APP_API_SESSION_SECRET:}
app.api.session.ttl-minutes=${APP_API_SESSION_TTL_MINUTES:720}
